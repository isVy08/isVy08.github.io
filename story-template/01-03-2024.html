document.addEventListener('DOMContentLoaded', function () {
  renderPoemArticle(document.getElementById('article-root'), {
    date: "March 2024",
    kind: "Poetry",
    title: "This is me releasing",
    stanzas: [
      ["Out of the scars", "I rise.", "Like a daisy", "blooming from the dirt."],
      ["This is about me fighting", "in the name of love", "not against anyone", "but the darkness resides underneath."],
      ["He is love.", "He is light,", "casting doubt on my shadow", "waking up my inner child."],
      ["It\u2019s easy to run away", "and let the ego fill out the rest", "than to say I\u2019m sorry", "for making up all the mess."],
      ["I got scathed", "by the unhealed wounds from the childhood", "when the storm is over", "it turns out the real storm is in my head,", "rooting from generations", "of fear, of loss, of frustration."],
      ["He is sparks", "He is fire", "taking down my mental cages", "burning up my delusive desires."],
      ["This is me releasing", "the unwanted baggages", "This is me stop resisting", "the used-to's, the wills", " and what-ifs."],
      ["And this is me trying", "to finally not to."],
      ["My bare feet on the ground", "Freedom is in my pocket", "Gratitude fills up my shoes", "On every step of mine is happiness."]
    ]
  });
});
</script>

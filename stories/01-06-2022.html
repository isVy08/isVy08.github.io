document.addEventListener('DOMContentLoaded', function () {
  renderPoemArticle(document.getElementById('article-root'), {
    date: "June 2022",
    kind: "Poetry",
    title: "An Affair",
    stanzas: [
      ["Please take my hand while this moment lasts", "Cause soon enough time would wash it away", "It's an unknown land with barely any dwellers", "No need to be disguised or afraid,", "Everyone's here just strangers."],
      ["Turn off our phones for a few seconds", "Escape the city for a couple of days", "Don't worry darling, my man is at work", "And your daughter is at school."],
      ["Please hold my hand when the sun goes down", "You're on a business trip and I'm back to my hometown", "Beauty is the daylight kissing your cheek", "Cruelty is the midnight breeding my prick."],
      ["Does this feel any right to you?", "As we're slipping through cracks of greys", "Infidelity smells so brand new", "Where integrity doesn't have a say."],
      ["It's not your fault to have a run-away bride", "It's not my fault when he lives across the globe", "I completely lost it when he's out of sight", "But, it's not his fault that I loved you first."],
      ["Let's right here pick up where we left of", "And keep writing our unfinished story", "Intimacy runs as far as the breeze goes", "We dug it up and it's time to have it buried."],
      ["Leave my hand, then would you drop it?", "Cause yours not been promised to mine", "A new start soon be another misstep", "If it's built up from tons of lies."],
      ["A word with \"s\" is the sharpest sword", "A man with guilt is the toughest judge", "Forgive me when I wanted a pause,", "For I cannot see us in trust."],
      ["Please drop my hand when the sun goes up", "Holding on to yours is the best and worst of life", "I'm happy placing you back to your spot", "As my heart's set free and so is my mind."]
    ]
  });
});

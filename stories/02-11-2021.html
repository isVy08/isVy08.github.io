document.addEventListener('DOMContentLoaded', function () {
  renderPoemArticle(document.getElementById('article-root'), {
    date: "November 2021",
    kind: "Poetry",
    title: "How Is It Going?",
    stanzas: [
      ["<em>I ran into someone from the past while in the mood of \"All too well\".</em>"],
      ["How is it going?", "I bet you're doing great", "Saw you from the far", "With a big smiley face"],
      ["Got one foot out the door", "Part of me wanna stay", "To say that I miss you", "But ended up walking away"],
      ["How's your skin these days?", "Still itchy when summer comes?", "Does it grow any thicker?", "After everything you've done"],
      ["What's it like by the way?", "To remain connected", "Got nothing left in common", "But somehow manage to stay"],
      ["Hope you've figured things out", "Learned that time wouldn't stop", "That youth doesn't come twice", "So take chances if you could"],
      ["Wish I did more than just wave", "But my mouth could barely speak", "While my heart's busy bleeding", "Since out of nowhere came a prick"],
      ["Just when thought it's over", "Sadly turns out it's not", "Will this pain last forever?", "Should I again take a shot?"],
      ["Well in case you ask", "I'd say I'm doing well", "Met some guys forth and back", "But scared to crack into hell"],
      ["You know I long for chemistry", "At least like one we both had", "Hope it's still in your memory", "That it wasn't that bad"],
      ["Honestly how's it going?", "Hope you're actually doing good", "Don't be like me, I'm faking", "Covering my tears with a hood"],
      ["Wondering if you remember", "I still rank boys in my head", "Around 5 and a quarter", "Imagine what you would've said"],
      ["Gosh I miss your humor", "Though oftentimes it's dark", "And I'm still funny-looking", "Running away when dogs bark"],
      ["They say be careful what you wish for", "'Cuz things never what you expect", "But hey it's November", "Already struggling to forget."]
    ]
  });
});

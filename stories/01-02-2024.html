document.addEventListener('DOMContentLoaded', function () {
  renderPoemArticle(document.getElementById('article-root'), {
    date: "February 2024",
    kind: "Poetry",
    title: "The Child",
    stanzas: [
      ["He came out to play", "who I never invited", "sobbing in a pool of mud", "for a slight frown of notice."],
      ["Years of being unloved", "unattended and uncared for", "Yelling into void", "and befriending blackness."],
      ["The arm guards melt in the heat", "of fatigue and resentment", "Down went the tears", "out of bruises and frustration."],
      ["When he spoke,", "I stopped listening.", "When he cried,", "I started to judge."],
      ["I teared him to shreds for the fragility.", "And I was the one taking all the hurt."],
      ["Could you stay silent for a while?", "For now this is enough.", "Don't push me away", "he said", "You're everything that I've got."],
      ["Been here since I was 5,", "with lots of baggage", "called goodbyes and regrets", "too much of them drives me crazy", "no matter how hard I suppress."],
      ["Into my arms", "I took him.", "Sorry for not loving you enough", "I know too much about the world,", "but still too little about how you exist."],
      ["Once and for all,", "let me acknowledge you", "let me set you free so you can grow up", "to see the nature of reality", "things have changed and", "they're full of hopes."],
      ["One blink into his little eyes", "goes into my own when I am awake.", "It's me the inner child that's shivering", "whose body that fear overtook."],
      ["Let's take some deep breaths", "You are safe here", "No need to run", "Here is home", "Home is now."],
      ["Open your eyes", "and step forward", "to me, to the light", "this is the only path.", "Everywhere else is falsity", "it will trap you in the ugly pasts."],
      ["Follow the sun", "Touch the light", "Dance peacefully", "beneath the sky."],
      ["The whole universe is resting upon you,", "can you see that?"]
    ]
  });
});

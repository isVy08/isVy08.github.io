  renderPoemArticle(document.getElementById('article-root'), {
    date: "November 2021",
    kind: "Poetry",
    title: "Is AI Intelligent Yet?",
    stanzas: [
      ["Is AI intelligent yet?", "A question we must not forget", "Every paper that comes out", "Should speak about it out loud"],
      ["Do machines get any smarter", "Understanding the world the way they should?", "Or is it just data hunger?", "Only better if they're full"],
      ["Will AI ever match the brain", "that learns so much from so little?", "Will AI beware of biases", "and correct them as it goes?", "Could we teach it about ethics", "to also know right from wrong?"],
      ["But is it right to have one like this", "keep getting incredibly strong", "One someday can outsmart us", "with power going far beyond?"]
    ]
  });
});

document.addEventListener('DOMContentLoaded', function () {
  renderPoemArticle(document.getElementById('article-root'), {
    date: "December 2022",
    kind: "Lyrics",
    title: "This Again",
    stanzas: [
      ["Beat: <a href=\"https://www.youtube.com/watch?v=j_Z8sTSY-DM\" target=\"_blank\" rel=\"noreferrer\">I Burned LA down</a>"],
      ["(Verse 1)", "If we could ever meet again,", "would you stop to say hello, and pretend we're still friends", "I've been busy filling up the hollow souls buried deep into scars years ago."],
      ["Anything you said,", "when you walked away", "I held it all inside,", "until this day"],
      ["(Chorus)", "Ooh, already left the town", "to be honest, I don't know how", "but I still see you around,", "there go many sleepless nights"],
      ["Going through your words", "that you said you cared, but you were never there.", "There used to be a fire sparking in your eyes,", "and the chemistry that we shared."],
      ["(Version 2)", "Is it just me,", "or all these good times are left behind,", "and old faces start to be replaced?"],
      ["Memories flying around", "in flakes of disturbances", "I can't help mourning the death of familiarity."],
      ["(Chorus)", "Ooh, I already left the town", "to be honest, I don't know how", "but I still see you around,", "there go many sleepless nights"],
      ["Going through your words", "that you said you cared, but you were never there.", "There used to be a fire sparking in our eyes,", "and the chemistry that we shared."],
      ["(Chorus)", "Ooh, after all these years", "Your voice never disappears", "I'm just nowhere to be near", "forgetting you"],
      ["I stand here wondering why time passes us by", "how many goodbyes I need to feel ok?"]
    ]
  });

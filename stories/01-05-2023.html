document.addEventListener('DOMContentLoaded', function () {
  renderPoemArticle(document.getElementById('article-root'), {
    date: "May 2023",
    kind: "Poetry",
    title: "Escape",
    stanzas: [
      ["Thought I've learned enough lessons,", "But I couldn't be any more wrong", "Just trying to let someone in", "And it stirs up all sorts of emotions."],
      ["How can betrayal even work,", "If things are yet to begin?", "After all this time, I still get hurt", "By the little words,", "And a tiny bit of imagination."],
      ["I overthink my overthoughts,", "Leaving them entangled,", "Constantly catching me off guard,", "But I never care to pull the brakes", "Keep watching it ride me much too hard."],
      ["I build up my own mental prison,", "Abuse it for a brief moment of high,", "Then I trap myself in, for god knows what reason,", "It's the price to pay,", "When you play with fire."],
      ["As always, I give it my all,", "It's a do-or-die, that's just how I live,", "I put up the wall when the party is over,", "Picking up the broken pieces,", "Placing them all back together."],
      ["It takes courage to not see the world as what it is,", "Rather what it should have been,", "Strangers would say I'm way too idealistic,", "But lots of healing must be done from within."],
      ["All you need is a leap of faith", "To move forward,", "And let the misery stay."],
      ["Sometimes,", "What you can only do is,", "To sit and wait", "For the pain to come,", "To go away,", "To come back,", "And to be replaced."]
    ]
  });
});

document.addEventListener('DOMContentLoaded', function () {
  renderPoemArticle(document.getElementById('article-root'), {
    date: "May 2022",
    kind: "Poetry",
    title: "Old Friend",
    stanzas: [
      ["Never thought I would drop by", "As almost about to leave", "The voice of yours took me by surprise", "The temptation I could not resist"],
      ["The smell brought me back years ago", "Memories wrapped in fragrant roses", "Nicely laying on our way to school", "You looked at me, I looked away, who could I fool ?"],
      ["How do I even begin ?", "You followed me on the same old street", "Filled with bumps and rainwater holes", "Secretively and privately, until we were home."],
      ["No one knew and no one had to know", "I put up guards, you dated her just for show", "Lovingly hated you in disguise", "\"I don't care if he lives or dies\""],
      ["Hey, old friend,", "Can I call you that ?", "Where has all the time flown ?", "Promise me a dazzling future ahead", "But not a warning against the regrets?"],
      ["Hey, old friend", "Has the time treated you well ?", "Over those years I've been on your trail", "Busy making ends meet in a coffee shop ?", "where your finesse finally pays off"],
      ["Someone walked me to your orphanage", "Which you never mentioned was dark and cold", "And school to you was an awful cage", "but it is my shiniest throne"],
      ["How do I even begin ?", "You were behind me on that same old street", "Filled with bumps and rainwater holes", "Secretively and privately, until we were home"],
      ["That was before you took a wrong turn", "That was when I couldn't breathe", "A dropout is what they called you", "The rumor no one wants to believe"],
      ["Hey, old friend", "What could have changed ?", "when I became a girl that's more than a friend,", "How the road not taken should have been?", "When you became my truest dream"],
      ["No one's talked about you since", "I really wish someone did", "Anamesis seems like a good old habit", "Mourning for an old friend's demise"],
      ["How do I even begin ?", "You're laid behind a well cut glass", "In this very room where roses are scattered", "where the dress code is either white or black"],
      ["This is our way to school", "I'm following you on this very old street", "There's no more bumps or rainwater holes", "I look at you, you smile away, what a fool !"]
    ]
  });
});

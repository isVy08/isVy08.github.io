document.addEventListener('DOMContentLoaded', function () {
  renderPoemArticle(document.getElementById('article-root'), {
    date: "July 2022",
    kind: "Lyrics",
    title: "Just Walk Away",
    stanzas: [
      ["Beat: <a href=\"https://www.youtube.com/watch?v=6HKCsWmZLcU&list=PLR4XuJ-iybKv34OEKbIXoD3XHCmEgmEHA&index=12\" target=\"_blank\" rel=\"noreferrer\">Golden G String</a>"],
      ["(Version 1)", "Pretty sure that you resent me", "for ignoring your texts and calls", "I stay in touch with my fantasy", "but away from most of all"],
      ["I admit to barely surviving", "Walking up is just too much", "Not a single day passing by", "Without me getting fucked up"],
      ["(Chorus)", "Oh, I'm eaten up by my own damn thoughts", "which turn out suicidal more often than not", "I'm way too good at showing the world all the pretty sides", "While crying alone", "Oh, it's never your fault", "when you walk away."],
      ["(Version 2)", "I was not and will never be", "there for you or anyone in need", "I loathe myself for this selfishness", "this shit sucks all my energy"],
      ["It's an ongoing battle", "where I lose myself most days", "I eat a lot and drink even more", "with my best friend, alcohol"],
      ["(Chorus)", "Oh, I'm eaten up by my own damn thoughts", "which turn out suicidal more often than not", "I'm way too good at showing the world all the pretty sides", "while crying alone", "Oh, it's never your fault", "when you walk away."],
      ["Every night comes back and haunts me", "with the fear of losing my mom", "and my little brother whom I never give enough love for", "Why it's me and the fucking disease", "every month it comes once or twice", "it's creeping up on everyone", "secretly ruining their lives"],
      ["(Chorus)", "Oh, sorry for failing the trust of yours", "I know I'm not a good friend or one at all", "Oh, please forgive me for breaking all the promises I made", "Yes, they're my mistakes.", "Oh, you should walk away", "There's no reason to stay."]
    ]
  });

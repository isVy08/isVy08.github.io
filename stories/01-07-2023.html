document.addEventListener('DOMContentLoaded', function () {
  renderPoemArticle(document.getElementById('article-root'), {
    date: "July 2023",
    kind: "Poetry",
    title: "This is me trying",
    stanzas: [
      ["To the heaviness in my soul,", "let the words carry the burden", "let them run wild in chaos", "and fall into place on their own."],
      ["What hurt you hurt me times a million.", "I was at fault for what really happened.", "It backfired like never before,", "crashed and burned right to the core."],
      ["It doesn't take a full year,", "for the damn cycle to repeat.", "It's the same old path I can notice,", "whose ending I am way too familiar with."],
      ["I'm stuck between some half-ass loves", "that aren't even worth given names.", "Eventually I'll be fucking them up.", "It's always a knock-out, but here I go again."],
      ["Sorry I didn't catch the rhyme,", "but who really gives a shit.", "Fuck that I'm just jamming,", "as if anyone out there woud read."],
      ["The question pounds my head,", "what's the sacrifice for this achievement.", "If enstrangement is the resounding yes,", "then at least I'm going with the current.", "Okay, I was wrong to ask.", "Confusion leads us to nowhere.", "I can't be speaking up for the truth,", "while acting out from lies at the root."],
      ["About this long", "I hold on to,", "is it the beach,", "my dad or", "a twin flame?"],
      ["If one has to be the bad guy,", "let me take on the hard job.", "So, this is me trying,", "on my second shot.", "Okay, it's harder than I thought", "I seem to underestimate it", "The signals are disturbing,", "among those rampant messages."],
      ["Long live the memories", "Hope they'll transcend this fleeting lifetime", "You'll stay peace wherever you're at", "Forget, fogetting and forgotten,", "Us, me and our existence."]
    ]
  });
});

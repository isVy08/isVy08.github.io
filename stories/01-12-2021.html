      ["Dăm l\u1ddi nói bâng quơ", "Vài câu đùa vô nghĩa", "Em d\u1ebrng lại ồ đó", "Tôi vẫn muốn nhích thêm"],
      ["Một bước tôi tiến lên", "Ba bước em lùi lại", "Thấy sao mình khờ dại", "Mặc kệ đúng và sai"],
      ["Em bí ẫn lạnh lùng", "Nhưng bên trong vụn vỡ", "Thương em tôi nhẫn nại", "Chờ bóc tách nỗi cô đơn"],
      ["Trách gì em, một lời từ chối", "Đường một chiều, ngoái đầu lại làm chì", "Huống gì khi, em không có lỗi", "Tự nguyện trao, em nào đòi hỏi gì"],
      ["Thiết tha gì, đoạn tình cảm đơn phương", "Đến rồi đi, hợp tan là lẽ thường", "Người thương, hoá người dưng cái một", "Thân thuộc, vẫn xa thân mật một đường"],

      ["Que sera sera !"],
      ["<hr>"],
      ["<strong>That Summer</strong>"],

      ["Memories pass by, just a moment", "Feeling that remains is elation", "Just thought, far enough away to forget", "Actually, long enough to reminisce"],
      ["You and I, two different worlds", "Same origin, but one south, one in the north", "Opposites, clear as the sky is blue", "Try to reconcile ? Into the pain I moved"],

      ["You need your own privacy", "While I'm eager to share", "Why hid the key but gave me the lock ?", "That wasn't totally fair"],

      ["Bunch of hurtful words", "In many pointless jokes", "Yo, let's just stop there", "I'm like, keep going folks"],
      ["One step forward I went", "Three steps backwards you took", "See, how silly was it then?", "Just did whatever I could"],
